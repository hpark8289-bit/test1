;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            &lt;/div&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            &lt;div class="border-t pt-3 flex justify-between"&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                &lt;button onclick="deleteCurrentFacility()" class="text-red-500 bg-red-50 px-3 py-1.5 rounded-lg text-xs font-medium border border-red-200"&gt;설비 삭제&lt;/button&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                &lt;button onclick="editCurrentFacility()" class="text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg text-xs font-medium border border-indigo-200"&gt;설비 정보 수정&lt;/button&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            &lt;/div&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        &lt;/div&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>    &lt;/div&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>    &lt;!-- 자바스크립트 로직 --&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>    &lt;script&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        let stations = [];</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        let activeTab = 'line';</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        let currentStationId = null;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        let currentFacilityId = null;</CHAR></TEXT><TEXT CharShape="5"/></P><P <TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            lucide.createIcons();</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            filterStations();</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        });</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        function saveToStorage() { localStorage.setItem('subway_app_data', JSON.stringify(stations)); }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        function switchSearchTab(tab) {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            activeTab = tab;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            document.getElementById('tab-line').className = tab === 'line' ? "flex-1 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-1.5 rounded-md text-slate-600 transition";</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            document.getElementById('tab-keyword').className = tab === 'keyword' ? "flex-1 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-1.5 rounded-md text-slate-600 transition";</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            document.getElementById('search-line-container').classList.toggle('hidden', tab !== 'line');</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            document.getElementById('search-keyword-container').classList.toggle('hidden', tab !== 'keyword');</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            filterStations();</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        function filterStations() {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            let result = [...stations];</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            if (activeTab === 'line') {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                const line = document.getElementById('line-select').value;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                if (line !== '전체') result = result.filter(s =&gt; s.line === line);</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                result.sort((a, b) =&gt; a.code.localeCompare(b.code, undefined, { numeric: true }));</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            } else {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                const kw = document.getElementById('keyword-input').value.trim().toLowerCase();</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                if (kw) result = result.filter(s =&gt; s.name.toLowerCase().includes(kw) || s.office.toLowerCase().includes(kw) || s.code.includes(kw));</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            renderStationList(result);</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        function renderStationList(list) {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            const container = document.getElementById('station-list');</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            document.getElementById('station-count.innerText`이나 station-count 가용 확인` text-xs font-semibold text-slate-500 bg-slate-200 px-2 py-0.5 rounded-full';</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            document.getElementById('station-count').innerText = `${list.length}개`;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            container.innerHTML = '';</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            if (list.length === 0) {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                container.innerHTML = `&lt;div class="text-center py-8 text-slate-400 text-sm"&gt;등록된 역 정보가 없습니다.&lt;/div&gt;`;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                return;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            list.forEach(st =&gt; {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                const card = document.createElement('div');</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                card.className = "bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-indigo-300 transition cursor-pointer flex justify-between items-center";</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                card.onclick = () =&gt; openStationDetailModal(st.id);</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                card.innerHTML = `</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                    &lt;div class="space-y-1"&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                        &lt;div class="flex items-center space-x-2"&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                            &lt;span class="px-2 py-0.5 rounded text-xs font-bold bg-blue-100 text-blue-800"&gt;${st.line}&lt;/span&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                            &lt;h3 class="font-bold text-slate-800"&gt;${st.name}&lt;/h3&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                            &lt;span class="text-xs text-slate-400 font-mono"&gt;(${st.code})&lt;/span&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                        &lt;/div&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                        &lt;p class="text-xs text-slate-500"&gt;관리소: ${st.office || '미지정'} | 설비: ${st.facilities.length}개&lt;/p&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                    &lt;/div&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                    &lt;i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"&gt;&lt;/i&gt;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                `;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                container.appendChild(card);</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            });</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            lucide.createIcons();</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>        function openStationModal(station = null) {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            document.getElementById('form-station').reset();</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            if (station) {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                document.getElementById('station-modal-title').innerText = "역 정보 수정";</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                document.getElementById('station-id').value = station.id;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                document.getElementById('station-line').value = station.line;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                document.getElementById('station-code').value = station.code;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                document.getElementById('station-name').value = station.name;</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                document.getElementById('station-phone').value = station.phone || '';</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                document.getElementById('station-office').value = station.office || '';</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>                document.getElementById('station-notes').value = station.notes || '';</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="14" Style="0"><TEXT CharShape="5"><CHAR>            }</CHAR></TEXT></P><P ColumnBreak="false" PageBreak="true" ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>from fastapi import FastAPI, HTTPException, Depends</CHAR></TEXT></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>from pydantic import BaseModel</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>from typing import List, Optional</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>import sqlite3</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>import datetime</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>app = FastAPI(title="지하철 역사 관리 API 서버")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># DB 초기화</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def init_db():</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    conn = sqlite3.connect("station_mgmt.db")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor = conn.cursor()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    </CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    # 역 정보 테이블</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    CREATE TABLE IF NOT EXISTS stations (</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        station_code TEXT PRIMARY KEY,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        line_name TEXT NOT NULL,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        station_name TEXT NOT NULL,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        phone TEXT,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        office TEXT,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        remarks TEXT</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    )</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    """)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    </CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    # 설비 정보 테이블</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    CREATE TABLE IF NOT EXISTS equipments (</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        eq_id INTEGER PRIMARY KEY AUTOINCREMENT,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        station_code TEXT NOT NULL,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        eq_name TEXT NOT NULL,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        eq_number TEXT NOT NULL,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        location TEXT,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        access_method TEXT,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        status TEXT DEFAULT '정상',</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        FOREIGN KEY(station_code) REFERENCES stations(station_code)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    )</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    """)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    </CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    # 변동 이력 테이블</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    CREATE TABLE IF NOT EXISTS history_logs (</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        log_id INTEGER PRIMARY KEY AUTOINCREMENT,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        eq_id INTEGER NOT NULL,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        change_date TEXT NOT NULL,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        description TEXT NOT NULL,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        FOREIGN KEY(eq_id) REFERENCES equipments(eq_id)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    )</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    """)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    conn.commit()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    conn.close()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>init_db()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def get_db():</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    conn = sqlite3.connect("station_mgmt.db")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    conn.row_factory = sqlite3.Row</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    try:</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        yield conn</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    finally:</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        conn.close()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># Pydantic 모델 정의</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>class StationSchema(BaseModel):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    line_name: str</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    station_name: str</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    station_code: str</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    phone: Optional[str] = ""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    office: Optional[str] = ""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    remarks: Optional[str] = ""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>class EquipmentSchema(BaseModel):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    station_code: str</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    eq_name: str</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    eq_number: str</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    location: Optional[str] = ""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    access_method: Optional[str] = ""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    status: str = "정상"</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>class HistorySchema(BaseModel):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    eq_id: int</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    description: str</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># 1. 역 등록 및 수정</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>@app.post("/stations/")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def create_or_update_station(station: StationSchema, db: sqlite3.Connection = Depends(get_db)):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor = db.cursor()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    INSERT INTO stations (station_code, line_name, station_name, phone, office, remarks)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    VALUES (?, ?, ?, ?, ?, ?)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    ON CONFLICT(station_code) DO UPDATE SET</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        line_name=excluded.line_name,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        station_name=excluded.station_name,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        phone=excluded.phone,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        office=excluded.office,</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        remarks=excluded.remarks</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    """, (station.station_code, station.line_name, station.station_name, station.phone, station.office, station.remarks))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    db.commit()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    return {"status": "success"}</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># 2. 역 검색 (호선별 전체 역번호순 또는 키워드)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>@app.get("/stations/search/")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def search_stations(line_name: Optional[str] = None, keyword: Optional[str] = None, db: sqlite3.Connection = Depends(get_db)):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor = db.cursor()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    if line_name:</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        cursor.execute("SELECT * FROM stations WHERE line_name = ? ORDER BY station_code ASC", (line_name,))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    elif keyword:</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        cursor.execute("SELECT * FROM stations WHERE station_name LIKE ? OR station_code LIKE ? ORDER BY station_code ASC", (f"%{keyword}%", f"%{keyword}%"))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    else:</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        cursor.execute("SELECT * FROM stations ORDER BY station_code ASC")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    rows = cursor.fetchall()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    return [dict(row) for row in rows]</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># 3. 역 상세 정보 및 설비 리스트</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>@app.get("/stations/{station_code}")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def get_station_detail(station_code: str, db: sqlite3.Connection = Depends(get_db)):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor = db.cursor()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("SELECT * FROM stations WHERE station_code = ?", (station_code,))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    st_row = cursor.fetchone()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    if not st_row:</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        raise HTTPException(status_code=404, detail="역을 찾을 수 없습니다.")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    </CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("SELECT * FROM equipments WHERE station_code = ?", (station_code,))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    eq_rows = cursor.fetchall()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    </CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    return {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        "station": dict(st_row),</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        "equipments": [dict(r) for r in eq_rows]</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># 4. 설비 등록</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>@app.post("/equipments/")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def add_equipment(eq: EquipmentSchema, db: sqlite3.Connection = Depends(get_db)):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor = db.cursor()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("""</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    INSERT INTO equipments (station_code, eq_name, eq_number, location, access_method, status)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    VALUES (?, ?, ?, ?, ?, ?)</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    """, (eq.station_code, eq.eq_name, eq.eq_number, eq.location, eq.access_method, eq.status))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    db.commit()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    return {"status": "success", "eq_id": cursor.lastrowid}</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># 5. 설비 상세 및 이력 조회</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>@app.get("/equipments/{eq_id}")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def get_equipment_detail(eq_id: int, db: sqlite3.Connection = Depends(get_db)):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor = db.cursor()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("SELECT * FROM equipments WHERE eq_id = ?", (eq_id,))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    eq = cursor.fetchone()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    if not eq:</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        raise HTTPException(status_code=404, detail="설비를 찾을 수 없습니다.")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    </CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("SELECT * FROM history_logs WHERE eq_id = ? ORDER BY log_id DESC", (eq_id,))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    logs = cursor.fetchall()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    </CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    return {</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        "equipment": dict(eq),</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>        "histories": [dict(l) for l in logs]</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    }</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># 6. 이력 등록</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>@app.post("/histories/")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def add_history(history: HistorySchema, db: sqlite3.Connection = Depends(get_db)):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor = db.cursor()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    now_str = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("INSERT INTO history_logs (eq_id, change_date, description) VALUES (?, ?, ?)",</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>                   (history.eq_id, now_str, history.description))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    db.commit()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    return {"status": "success"}</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># 7. 이력 수정</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>@app.put("/histories/{log_id}")</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>def update_history(log_id: int, description: str, db: sqlite3.Connection = Depends(get_db)):</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor = db.cursor()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    cursor.execute("UPDATE history_logs SET description = ? WHERE log_id = ?", (description, log_id))</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    db.commit()</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR>    return {"status": "success"}</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEXT CharShape="5"><CHAR># 8. 이력 삭제</CHAR></TEXT><TEXT CharShape="5"/></P><P ParaShape="13" Style="0"><TEX
